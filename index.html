<script>
// ===== 00_config.js =====
// ============================================================
// HEARTHVALE - tunable constants. Change numbers here to rebalance.
// ============================================================
const CFG = {
  VERSION: '1.3.0',
  TILE: 32,                 // pixels per tile
  WORLD_W: 240, WORLD_H: 240,
  SEED: 20261124,
  DAY_LENGTH_SEC: 1200,     // real seconds per in-game day (20 min)
  START_HOUR: 8,
  // progression
  MAX_LEVEL: 50,
  XP_BASE: 90, XP_EXP: 1.75,          // xp to next level = XP_BASE * level^XP_EXP
  STAT_POINTS_PER_LEVEL: 3,
  CLASS_RANK_MAX: 20, CLASS_XP_BASE: 120, CLASS_XP_EXP: 1.6,
  JOB_RANK_MAX: 50, JOB_XP_BASE: 40, JOB_XP_EXP: 1.45,
  MONSTER_XP_MULT: 1.0,
  GOLD_DROP_MULT: 1.0,
  LOOT_EQUIP_CHANCE: 0.11,  // chance a normal monster drops a piece of gear
  RARITY_WEIGHTS: [1000, 320, 90, 18, 2.5], // common, uncommon, rare, epic, legendary
  // death (no timers, no permadeath)
  DEATH_GOLD_LOSS: 0.20,    // fraction of carried (not banked) gold lost
  DEATH_DURABILITY_LOSS: 0.10, // fraction of max durability lost on every equipped item
  DEATH_RESPAWN_HP: 0.5,
  DURABILITY_LOSS_PER_HIT: 0.02, // per hit taken, chance-based wear
  // world / spawns
  ZONE_LEVEL_PER_TILE: 0.24,   // monster level grows with distance from town
  MAX_MONSTERS_NEAR: 34, SPAWN_RADIUS_MIN: 18, SPAWN_RADIUS_MAX: 30, DESPAWN_RADIUS: 46,
  NIGHT_SPAWN_MULT: 1.4, NIGHT_AGGRO_MULT: 1.3,
  NODE_RESPAWN_SEC: 90,
  FARM_GROW_SEC: 240,       // real seconds for a crop stage-set to fully grow (scaled by crop)
  TOWN_RADIUS: 22,
  // economy
  SELL_RATE: 0.25, REPAIR_COST_PER_POINT: 0.35,
  // misc
  AUTOSAVE_SEC: 60,
  PLAYER_SPEED: 150,        // px/sec
  NPC_COUNT: 26,
  INV_SLOTS: 40, BANK_SLOTS: 60,
  // v1.2
  BOSS_RESPAWN_DAYS: 3,     // in-game days a beaten boss stays down (then returns stronger)
  RARE_CHANCE: 0.012,       // chance a world spawn is a named rare monster
  GILDED_CHANCE: 0.003,     // chance of a fleeing Gilded Goblin
  GATHER_SURPRISE: 0.012,   // chance gathering triggers an ambush or a lucky find
  CACHE_REFILL_DAYS: 2,     // Blightmarsh caches refill after this many days
  NPC_QUEST_MAX: 4,         // townsfolk favors you can hold at once
  RECRUIT_AFFINITY: 60, RECRUIT_FAVORS: 3, PARTY_ENABLED: false, // groundwork for a future party system
  // v1.3 Hearthvale Keep
  ROYAL_PASS_FAVORS: 2,     // court favors needed for the Inner Bailey Pass
  ROYAL_AUDIENCE_STANDING: 30, // Royal Standing needed for an audience with the King
  ROYAL_FREEDOM_STANDING: 50,  // Royal Standing needed (with the King's charge done) for Freedom of the Keep
  COURT_GOLD_MULT: 2.2, COURT_NEED_MULT: 1.5, COURT_XP_MULT: 1.6, // court favors pay better and ask more
  RAID_STANDING_PER_NIGHT: 5,  // max Royal Standing from raid kills each night
  TOURNEY_WEEKDAY: 3, FEAST_WEEKDAY: 6, // 0 = Moonday
  WRIT_PRICE: 400,          // Treasurer sells one Royal Commission a week (Freedom of the Keep needed)
};

// ===== 01_util.js =====
// ---------- utilities ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG = mulberry32(Date.now() & 0xffffffff);           // gameplay randomness
const rand = () => RNG();
const randi = (a, b) => a + Math.floor(rand() * (b - a + 1));
const randf = (a, b) => a + rand() * (b - a);
const pick = arr => arr[Math.floor(rand() * arr.length)];
const chance = p => rand() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n));
let _uid = 1; const uid = () => (_uid++).toString(36) + Math.floor(rand() * 1e6).toString(36);
function weightedPick(weights){let s=0;for(const w of weights)s+=w;let r=rand()*s;for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return i;}return weights.length-1;}
// deterministic hash noise for world generation
function hash2(x, y, s){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
function smooth(t){return t*t*(3-2*t);}
function vnoise(x, y, s){const xi=Math.floor(x),yi=Math.floor(y),xf=smooth(x-xi),yf=smooth(y-yi);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return lerp(lerp(a,b,xf),lerp(c,d,xf),yf);}
function fbm(x, y, s){return vnoise(x,y,s)*0.6+vnoise(x*2.1,y*2.1,s+7)*0.3+vnoise(x*4.3,y*4.3,s+13)*0.1;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ---------- A* pathfinding on a tile map (8-dir, no corner cutting) ----------
function findPath(map, sx, sy, tx, ty, maxIter = 9000){
  const W = map.w, H = map.h;
  sx|=0; sy|=0; tx|=0; ty|=0;
  if (sx<0||sy<0||sx>=W||sy>=H||tx<0||ty<0||tx>=W||ty>=H) return null;
  if (map.solidAt(tx, ty)) { // retarget to nearest walkable neighbour
    let best=null,bd=1e9;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=tx+dx,y=ty+dy;if(!map.solidAt(x,y)){const d=Math.abs(dx)+Math.abs(dy)+dist(x,y,sx,sy)*0.001;if(d<bd){bd=d;best=[x,y];}}}
    if(!best) return null; tx=best[0]; ty=best[1];
  }
  if (sx===tx && sy===ty) return [];
  const key = (x, y) => y * W + x;
  const g = new Map(), came = new Map(), closed = new Set();
  const heap = []; // [f, k]
  const push = (f, k) => { heap.push([f, k]); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = i*2+1, r = l+1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  const h = (x, y) => { const dx = Math.abs(x - tx), dy = Math.abs(y - ty); return (dx + dy) + (1.414 - 2) * Math.min(dx, dy); };
  const sk = key(sx, sy); g.set(sk, 0); push(h(sx, sy), sk);
  let iter = 0;
  while (heap.length && iter++ < maxIter) {
    const [, k] = pop(); if (closed.has(k)) continue; closed.add(k);
    const x = k % W, y = (k / W) | 0;
    if (x === tx && y === ty) { const path = []; let c = k; while (c !== sk) { path.push([c % W, (c / W) | 0]); c = came.get(c); } return path.reverse(); }
    const gk = g.get(k);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue; const nx = x + dx, ny = y + dy;
      if (map.solidAt(nx, ny)) continue;
      if (dx && dy && (map.solidAt(x + dx, y) || map.solidAt(x, y + dy))) continue;
      const nk = key(nx, ny); if (closed.has(nk)) continue;
      const ng = gk + (dx && dy ? 1.414 : 1) + (map.costAt ? map.costAt(nx, ny) : 0);
      if (ng < (g.has(nk) ? g.get(nk) : 1e9)) { g.set(nk, ng); came.set(nk, k); push(ng + h(nx, ny), nk); }
    }
  }
  return null;
}

// ---------- equipment generation ----------
function tierForIlvl(ilvl) { return ilvl >= 30 ? 3 : ilvl >= 21 ? 2 : ilvl >= 13 ? 1 : 0; }
function materialName(base, tier) {
  const b = EQUIP_BASES[base], T = TIERS[tier];
  if (b.weight === 'leather') return T.leather.replace('Rough Leather', 'Leather');
  if (b.weight === 'cloth') return T.cloth;
  if (b.weight === 'plate') return T.plate;
  if (base === 'bow' || base === 'staff' || base === 'wand') return ['Pine', 'Oak', 'Ashwood', 'Elderwood'][tier];
  if (base === 'tome') return ['Linen-bound', 'Silken', 'Spellwoven', 'Shadowbound'][tier];
  return T.wpn;
}
function rollAffixes(n, ilvl, mult, exclude = []) {
  const out = {}; const pool = AFFIX_POOL.filter(a => !exclude.includes(a));
  for (let k = 0; k < n && pool.length; k++) {
    const a = pool.splice(Math.floor(rand() * pool.length), 1)[0];
    let v = AFFIXES[a].roll(ilvl) * randf(0.8, 1.2) * (0.85 + mult * 0.15);
    v = (v < 1) ? +v.toFixed(3) : Math.round(v * 10) / 10; if (v >= 3) v = Math.round(v);
    out[a] = v;
  }
  return out;
}
// opts: {rarity, quality, tier}
function genEquip(base, ilvl, opts = {}) {
  const b = EQUIP_BASES[base]; ilvl = Math.max(1, Math.round(ilvl));
  const crafted = opts.quality !== undefined;
  const R = crafted ? QUALITIES[opts.quality] : RARITIES[opts.rarity || 0];
  const tier = opts.tier !== undefined ? opts.tier : tierForIlvl(ilvl);
  const it = { kind: 'equip', uid: uid(), base, slot: b.slot, ilvl, tier, rarity: crafted ? -1 : (opts.rarity || 0), quality: crafted ? opts.quality : undefined, stats: {}, crafted };
  const m = R.mult;
  if (b.slot === 'weapon') {
    const avg = (5 + ilvl * 2.0) * b.dmg * m;
    it.dmg = [Math.max(1, Math.round(avg * 0.8)), Math.max(2, Math.round(avg * 1.2))];
    it.speed = b.speed; it.dtype = b.type;
  } else if (!b.jewel) {
    const sd = SLOT_DEF[b.slot] || 1, wd = b.weight ? WEIGHT[b.weight].def : (b.def || 1);
    it.def = Math.max(1, Math.round((3 + ilvl * 1.1) * sd * wd * m));
  }
  // implicits
  const imp = Object.assign({}, b.implicit || {}, b.weight ? WEIGHT[b.weight].implicit : {});
  for (const [k, v] of Object.entries(imp)) {
    if (STATS.includes(k)) it.stats[k] = (it.stats[k] || 0) + Math.max(1, Math.round(v * (1 + ilvl * 0.5)));
    else if (k === 'mana') it.stats.mana = (it.stats.mana || 0) + Math.round(3 + ilvl * 1.2);
    else it.stats[k] = (it.stats[k] || 0) + v;
  }
  let nAff = R.affixes + (b.jewel ? 1 : 0);
  if (!crafted && opts.rarity === 0 && b.jewel) nAff = 1;
  const exclude = b.slot === 'weapon' ? ['def', 'block'] : (base === 'shield' ? [] : ['block']);
  const aff = rollAffixes(nAff, ilvl, m, exclude);
  for (const [k, v] of Object.entries(aff)) it.stats[k] = +((it.stats[k] || 0) + v).toFixed(3);
  it.affixKeys = Object.keys(aff);
  it.maxDur = Math.round((40 + ilvl * 2) * (crafted ? 1.25 : 1)); it.dur = it.maxDur;
  it.req = Math.max(1, ilvl - 3);
  // name
  const mat = materialName(base, tier);
  if (!crafted && it.rarity === 4) it.name = b.name + ' of ' + pick(LEGENDARY_NAMES);
  else if (b.jewel) it.name = (crafted ? mat + ' ' : (DROP_TIER_NAMES[tier] + ' ')) + b.name + (it.affixKeys[0] ? ' of ' + AFFIXES[it.affixKeys[0]].name : '');
  else it.name = mat + ' ' + b.name + (!crafted && it.affixKeys[0] ? ' of ' + AFFIXES[it.affixKeys[0]].name : '');
  if (crafted && opts.quality >= 2) it.name = R.name + ' ' + it.name;
  it.value = Math.round((6 + ilvl * 5) * m * m);
  return it;
}
function rollRarity(luck = 0, boost = 0) {
  const w = CFG.RARITY_WEIGHTS.map((v, i) => i === 0 ? v : v * (1 + luck) * (1 + boost * i));
  return weightedPick(w);
}
const DROP_BASES = Object.keys(EQUIP_BASES);
function randomDrop(ilvl, luck, boost) { return genEquip(pick(DROP_BASES), ilvl, { rarity: rollRarity(luck, boost) }); }
function itemColor(it) { if (!it) return '#ccc'; if (it.kind === 'equip') return it.crafted ? QUALITIES[it.quality].color : RARITIES[it.rarity].color; return '#e8e8e8'; }

// ---------- inventory helpers ----------
function invAdd(inv, id, qty) { // stackable
  const max = ITEMS[id].stack;
  for (let i = 0; i < inv.length && qty > 0; i++) { const s = inv[i]; if (s && s.id === id && s.qty < max) { const a = Math.min(qty, max - s.qty); s.qty += a; qty -= a; } }
  for (let i = 0; i < inv.length && qty > 0; i++) if (!inv[i]) { const a = Math.min(qty, max); inv[i] = { id, qty: a }; qty -= a; }
  return qty; // leftover
}
function invAddEquip(inv, it) { const i = inv.indexOf(null); if (i < 0) return false; inv[i] = it; return true; }
function invCount(inv, id) { let n = 0; for (const s of inv) if (s && s.id === id) n += s.qty; return n; }
function invRemove(inv, id, qty) { for (let i = inv.length - 1; i >= 0 && qty > 0; i--) { const s = inv[i]; if (s && s.id === id) { const a = Math.min(qty, s.qty); s.qty -= a; qty -= a; if (!s.qty) inv[i] = null; } } return qty === 0; }

function statLine(k, v) { return AFFIXES[k] ? AFFIXES[k].fmt(v) : (STAT_NAMES[k] ? '+' + v + ' ' + STAT_NAMES[k] : k + ' ' + v); }
function itemTooltip(it, cmp) {

  if (it.dmg) h += `<div class="tt-big">${it.dmg[0]}-${it.dmg[1]} ${it.dtype} damage</div><div>${it.speed.toFixed(2)} attacks/sec · ${b.melee ? 'melee' : 'ranged'}</div>`;

// green/red stat deltas vs the currently equipped item
function compareHtml(it, cmp) {

  const keys = new Set([...Object.keys(it.stats || {}), ...Object.keys(cmp.stats || {})]);

    const pct = ['crit', 'aspd', 'firePct', 'frostPct', 'holyPct', 'physPct', 'move', 'gold', 'jobxp', 'block'].includes(k);
    const name = STAT_NAMES[k] || (AFFIXES[k] ? AFFIXES[k].name : k);
    const nice = { hp: 'Max Life', mana: 'Max Mana', crit: 'Crit', aspd: 'Attack Speed', firePct: 'Fire Dmg', frostPct: 'Frost Dmg', holyPct: 'Holy Dmg', physPct: 'Phys Dmg', def: 'Armor', regen: 'Life/s', move: 'Move Speed', gold: 'Gold Find', jobxp: 'Job XP', block: 'Block', mana_regen: 'Mana/s' }[k] || name;

class GameMap {
  constructor(id, w, h) {
    this.id = id; this.w = w; this.h = h;
    this.tiles = new Uint8Array(w * h); this.zone = new Uint8Array(w * h); this.var = new Uint8Array(w * h);
    this.objSolid = new Uint8Array(w * h); this.objects = []; this.objGrid = new Map();
    this.fog = new Uint8Array(w * h); this.buildings = []; this.lights = []; this.dark = false;
    this.monsters = []; this.drops = []; this.projectiles = []; this.effects = [];
  }
  idx(x, y) { return y * this.w + x; }
  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  tile(x, y) { return this.in(x, y) ? this.tiles[y * this.w + x] : T.VOID; }
  set(x, y, t) { if (this.in(x, y)) this.tiles[y * this.w + x] = t; }
  solidAt(x, y) { if (!this.in(x, y)) return true; const i = y * this.w + x; return TILE_DEF[this.tiles[i]].solid || this.objSolid[i]; }
  costAt(x, y) { const d = TILE_DEF[this.tile(x, y)]; return d.cost || 0; }
  solidPx(px, py) { return this.solidAt(Math.floor(px / CFG.TILE), Math.floor(py / CFG.TILE)); }
  addObj(o) { o.uid = o.uid || uid(); this.objects.push(o); const w = o.w || 1, h = o.h || 1;
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) { const k = this.idx(o.x + xx, o.y + yy); this.objGrid.set(k, o); if (o.solid) this.objSolid[k] = 1; }
    return o; }
  objAt(x, y) { return this.objGrid.get(this.idx(x, y)); }
  zoneAt(x, y) { return ZONES[this.zone[this.idx(clamp(x | 0, 0, this.w - 1), clamp(y | 0, 0, this.h - 1))]]; }
  reveal(tx, ty, r) { let ch = false; for (let y = ty - r; y <= ty + r; y++) for (let x = tx - r; x <= tx + r; x++) { if (!this.in(x, y)) continue; if ((x - tx) ** 2 + (y - ty) ** 2 > r * r) continue; const i = this.idx(x, y); if (!this.fog[i]) { this.fog[i] = 1; ch = true; } } return ch; }
}

// ---------- jobs: gathering, crafting, farming, tasks, services ----------
function hasJob(j) { return !!G.player.jobs[j]; }
function needJobMsg(j) { const J = JOBS[j]; log(`You need the ${J.name} job. ${G.player.discovered[J.poi] ? 'Its teacher: ' + J.hint : 'Rumor: ' + J.hint}`, 'warn'); }
function startGather(o) {
  const P = G.player;
  if (!hasJob(o.job)) return needJobMsg(o.job);
  if (jobRank(P, o.job) < o.rank) return log(`Requires ${JOBS[o.job].name} rank ${o.rank}. (You are rank ${jobRank(P, o.job)})`, 'warn');
  if (o.charges <= 0) return log(`This ${o.kind === 'fish' ? 'spot is fished out' : o.name + ' is depleted'}. It will recover in a while.`, 'dim');
  if (o.night && !isNight()) return log(`${o.name} can only be gathered at night.`, 'warn');
  const rk = jobRank(P, o.job);
  const dur = o.kind === 'fish' ? Math.max(1.6, randf(2.5, 4.5) - rk * 0.03) : Math.max(1.0, 2.6 + o.tier * 0.5 - rk * 0.025);
  P.channel = { kind: 'gather', obj: o, t: 0, dur, label: { ore: 'Mining', tree: 'Chopping', herb: 'Gathering', fish: 'Fishing' }[o.kind] };
  P.facing = Math.atan2((o.y + 0.5) * CFG.TILE - P.y, (o.x + 0.5) * CFG.TILE - P.x);
}
function finishGather(c) {
  const P = G.player, o = c.obj, rk = jobRank(P, o.job);
  if (o.kind === 'fish' && !chance(0.7 + rk * 0.006)) { log('It got away...', 'dim'); addText(P.x, P.y - 30, 'Escaped!', '#aaa', 12); }
  else {
    const yieldB = rk * 0.02 + racePerk(P, 'yield_' + o.job) + (o.tier < Math.floor(rk / 10) ? 0.3 : 0);
    let qty = 1 + (chance(yieldB % 1) ? 1 : 0) + Math.floor(yieldB);
    const left = invAdd(P.inv, o.item, qty);
    if (left) { log('Inventory full!', 'bad'); P.channel = null; return; }
    addText(P.x, P.y - 34, '+' + qty + ' ' + ITEMS[o.item].name, '#e8e8e8', 12);
    chat('loot', `Gathered ${qty}× ${esc(ITEMS[o.item].name)}`, '');
    gainJobXp(P, o.job, 7 + o.tier * 9 + (o.kind === 'fish' ? 3 : 0));
    // rare finds
    if (o.kind === 'ore' && chance(0.02)) { const gem = genEquip(pick(['ring', 'amulet']), TIERS[o.tier].ilvl, { rarity: 1 + (chance(0.25) ? 1 : 0) }); if (invAddEquip(P.inv, gem)) log(`You found ${gem.name} in the rock!`, 'gold'); }
    if (o.kind === 'fish' && chance(0.03)) { invAdd(P.inv, 'potion_hp2', 1); log('You fished up a sealed potion bottle!', 'gold'); }
    onGatherForTasks(o.item, qty);
    if (chance(CFG.GATHER_SURPRISE)) gatherSurprise(o);
  }
  o.charges--; sfx(o.kind === 'ore' ? 'mine' : o.kind === 'tree' ? 'chop' : 'pick');
  if (o.charges <= 0) { o.respawn = CFG.NODE_RESPAWN_SEC * (1 + o.tier * 0.3); P.channel = null; log(`The ${o.name} is exhausted.`, 'dim'); }
  else { const keep = o; P.channel = null; startGather(keep); } // keep gathering automatically
  UI.dirty = true;
}
function updateNodes(m, dt) { for (const o of m.objects) if (o.type === 'node' && o.charges <= 0) { o.respawn -= dt; if (o.respawn <= 0) o.charges = o.maxCharges; } }

// ---- crafting ----
function recipeOutName(r) { return r.out.item ? ITEMS[r.out.item].name + (r.out.qty > 1 ? ' x' + r.out.qty : '') : (r.out.relic ? (r.out.royal ? '♛ Royal ' : '★ ') + RELIC_BY_ID[r.out.relic].prefix : materialName(r.out.equip, r.out.tier)) + ' ' + EQUIP_BASES[r.out.equip].name; }
function canCraft(r) { const P = G.player; return r.inputs.every(([id, q]) => invCount(P.inv, id) >= q); }
function startCraft(r, count) {
  const P = G.player; if (!hasJob(r.job)) return needJobMsg(r.job);
  if (jobRank(P, r.job) < r.rank) return log(`Requires ${JOBS[r.job].name} rank ${r.rank}.`, 'warn');
  if (!canCraft(r)) return log('Missing materials.', 'warn');
  P.channel = { kind: 'craft', recipe: r, t: 0, dur: Math.max(0.6, r.time - jobRank(P, r.job) * 0.01), left: count, label: 'Crafting ' + recipeOutName(r) };
}
function craftQuality(rank, req) { const d = rank - req; const mw = clamp(0.02 + d * 0.012, 0.02, 0.3), sup = clamp(0.12 + d * 0.02, 0.12, 0.45), fine = 0.38; const r = rand(); if (r < mw) return 3; if (r < mw + sup) return 2; if (r < mw + sup + fine) return 1; return 0; }
function finishCraft(c) {
  const P = G.player, r = c.recipe;
  if (!canCraft(r)) { log('Missing materials.', 'warn'); P.channel = null; return; }
  if (r.out.equip && !invFree(P.inv)) { log('Inventory full!', 'bad'); P.channel = null; return; }
  for (const [id, q] of r.inputs) invRemove(P.inv, id, q);
  if (r.out.item) { invAdd(P.inv, r.out.item, r.out.qty); addText(P.x, P.y - 34, '+' + r.out.qty + ' ' + ITEMS[r.out.item].name, '#e8e8e8', 12); chat('loot', `Crafted ${r.out.qty}× ${esc(ITEMS[r.out.item].name)}`, ''); onCraftForTasks(r.out.item, r.out.qty); }

function genTasks() {

      } else if (J.kind === 'craft') {

        out.push({ id: uid(), kind: 'deliver', job: j, item: rc.out.item, need: n, gold: Math.round(ITEMS[rc.out.item].value * n * 1.4 + 15), xp: rc.xp * n * 0.8, title: `${J.name} order: ${n} ${ITEMS[rc.out.item].name}` });
      } else if (j === 'hunter') {

        out.push({ id: uid(), kind: 'deliver', job: 'hunter', item: mats, need: n, gold: Math.round(ITEMS[mats].value * n * 1.8 + 10), xp: 15 + n * (5 + tier * 5), title: `Hunter order: ${n} ${ITEMS[mats].name}` });
      } else if (j === 'merchant') {

  // ----- dialogs -----

  },
  building(b) {
    const P = G.player; if (b.house) return this.dialog('A cozy house', 'Someone lives here. ' + (G.npcs.filter(n => n.home === b).map(n => esc(n.name)).join(', ') || ''), [{ label: 'Leave', fn: () => UI.close() }]);
    const btns = [];

      if (k === 'repair') btns.push({ label: `🔧 Repair all (${repairCost(P)}g)`, fn: () => { repairAll(); UI.building(b); } });
      if (k === 'bank') btns.push({ label: '🏦 Open bank', fn: () => UI.bank() });
      if (k === 'board') btns.push({ label: '📜 Job Board', fn: () => UI.board() });
      if (k === 'rest') btns.push({ label: `🛏 Rest until morning (10g)`, fn: () => restAtInn() });
      if (k === 'job') { if (P.jobs[v]) body += `<div>You are a <b>${JOBS[v].name}</b> (rank ${P.jobs[v].rank}). ${JOBS[v].station ? 'Use the ' + STATION_NAMES[JOBS[v].station] + ' outside to craft.' : ''}</div>`;
        else { body += `<div>"Interested in the <b>${JOBS[v].name}</b> trade? ${JOBS[v].perk} I'll teach you for free."</div>`; btns.push({ label: `Learn ${JOBS[v].name}`, fn: () => { learnJob(v); UI.building(b); } }); } }

        else { body += `<div>"${CLASSES[v].desc}${P.classes[v] ? ' Welcome back.' : ' Shall I train you?'}"</div>${P.cls !== 'adventurer' && !P.classes[v] ? '<div class="small dim">Your current class rank is kept. You can switch back any time in town.</div>' : ''}`; btns.push({ label: P.classes[v] ? `Switch to ${CLASSES[v].name}` : `Become a ${CLASSES[v].name}`, fn: () => { learnClass(v); UI.building(b); } }); } }
    }
    for (const s of b.services) { const [k, v] = s.split(':'); if (k === 'royal' && ROYAL_SERVICES[v]) body += ROYAL_SERVICES[v](b, btns); }
    if (b.id === 'chapel') body += `<div class="small">Sister Amaris: "The dead below the old crypt shrug off steel. Fire burns them, and holy light breaks them. Take holy water if you go."</div>`;
    btns.push({ label: 'Leave', fn: () => UI.close() });

  },
  npc(n) {
    const P = G.player; if (n.trainer) return this.building(n.building);
    if (P.affinity[n.id] === undefined) P.affinity[n.id] = 0; const info = npcInfo(n.id), day = gameDay();
    if (info.talkDay !== day) { info.talkDay = day; addAffinity(n, 1); }
    const aff = P.affinity[n.id], q = npcQuest(n);
    let line = n.court && courtLine(n) ? courtLine(n) : n.job === 'elder' ? (P.leads.length < RUMORS.length ? 'Ah, a new face. Every trade in this valley has a teacher somewhere. Ask, and I\'ll tell you what I\'ve heard.' : 'You know all I know. Go and see the world.') : pick(NPC_LINES[n.job] || NPC_LINES.any);
    const btns = []; let qhtml = '';
    if (q && q.state === 'offered') { qhtml = `<div class="quest"><b>Favor:</b> "${esc(q.line)} Could you ${esc(q.title.toLowerCase())}${q.where ? ' (' + esc(q.where) + ')' : ''}?"<br><span class="small">Reward: <span class="gold">${q.gold}g</span> + ${q.xp} XP + friendship${q.bonus ? ' + ' + esc(ITEMS[q.bonus].name) : ''}</span></div>`;
      btns.push({ label: `✔ Accept favor: ${esc(q.title)}`, disabled: activeQuests().length >= CFG.NPC_QUEST_MAX, fn: () => { acceptQuest(n); UI.npc(n); } }); }
    else if (q && q.state === 'active') { const pr = questProgress(q), done = pr >= q.need;
      qhtml = `<div class="quest"><b>Favor:</b> ${esc(q.title)} — ${Math.min(pr, q.need)}/${q.need} ${done ? '<span class="gold">ready!</span>' : ''}</div>`;
      btns.push({ label: done ? `🎁 Hand in: ${esc(q.title)}` : `Hand in (${Math.min(pr, q.need)}/${q.need})`, disabled: !done, fn: () => { handInQuest(n); UI.npc(n); } });
      btns.push({ label: 'Give up the favor', fn: () => UI.choose('Give up?', `${esc(n.name)} will be a little disappointed (-2 friendship).`, [{ label: 'Give up', danger: true, fn: () => { abandonQuest(n); UI.npc(n); } }], () => UI.npc(n)) }); }
    else qhtml = n.noFavors ? '' : `<div class="small dim">${esc(n.name)} has nothing else to ask of you today.</div>`;
    if (n.job === 'elder') { const next = RUMORS.find(r => !P.leads.includes(r)); btns.push({ label: next ? 'Ask for rumors' : 'No more rumors', disabled: !next, fn: () => { P.leads.push(next); log('New lead: ' + next, 'job'); UI.npc(n); } }); }
    if (n.court) courtButtons(n, btns);
    btns.push({ label: info.giftDay === day ? 'Gift given today' : '🎀 Give a gift', disabled: info.giftDay === day, fn: () => this.giftPicker(n) });
    const elig = Party.eligible(n);
    if (!n.court) btns.push({ label: 'Invite to party (coming later)', disabled: !Party.canRecruit(n), tt: elig ? `${n.name} would follow you. Parties arrive in a future update.` : `Needs ${CFG.RECRUIT_AFFINITY} friendship and ${CFG.RECRUIT_FAVORS} favors. Parties arrive in a future update.`, fn: () => Party.recruit(n) });
    btns.push({ label: 'Goodbye', fn: () => UI.close() });
    const hearts = Math.floor(aff / 10);
    this.dialog(n.name, `<div><b>${esc(n.name)}</b> · ${RACES[n.race].name} ${n.court ? esc(n.title) : n.job === 'laborer' ? 'Laborer' : (JOBS[n.job] ? JOBS[n.job].name : n.job[0].toUpperCase() + n.job.slice(1))} · Level ${n.level}</div>
      <div class="dim small">Mood: ${n.mood} · ${n.court ? courtActivityText(n) : npcActivityText(n)}</div>${n.court ? courtBody(n) : ''}
      <div class="small" data-tt="Friendship rises when you talk (once a day), do favors and give gifts. Likes: ${esc((NPC_LIKES[n.job] || []).map(id => ITEMS[id] ? ITEMS[id].name : id).join(', '))}">Friendship: <span class="heart">${'♥'.repeat(hearts)}</span><span class="dim">${'♡'.repeat(10 - hearts)}</span> ${aff}/100 · <b>${affTier(aff)}</b> · Favors done: ${info.favors}${elig ? ' · <span class="gold">Would join your party (coming later)</span>' : ''}</div>
      <div class="dlg-line">"${esc(line)}"</div>${qhtml}`, btns);
  },
  giftPicker(n) {
    const P = G.player; const likes = NPC_LIKES[n.job] || []; const ids = [...new Set(P.inv.filter(s => s && !s.kind && ITEMS[s.id].type !== 'note').map(s => s.id))];
    ids.sort((a, b) => (likes.includes(b) ? 1 : 0) - (likes.includes(a) ? 1 : 0) || ITEMS[b].value - ITEMS[a].value);
    if (!ids.length) return this.choose('Give a gift', 'You have nothing to give. Gear can\'t be gifted, but food, materials and potions can.', [], () => UI.npc(n));
    this.choose('Give a gift to ' + n.name, `Pick something from your bag. ${esc(n.name)} loves: ${esc(likes.map(id => ITEMS[id] ? ITEMS[id].name : id).join(', '))}.`,
      ids.slice(0, 12).map(id => ({ label: (likes.includes(id) ? '♥ ' : '') + esc(ITEMS[id].name), sub: `you have ${invCount(P.inv, id)}${likes.includes(id) ? ' · loved (+5)' : ITEMS[id].value >= 20 ? ' · +3' : ' · +2'}`, fn: () => { giveGift(n, id); UI.npc(n); } })), () => UI.npc(n));
  },
  shop(id) {

    const stock = S.stock.map(sid => `<div class="shoprow" data-tt="1" data-sid="${sid}"><span class="ic" style="color:${ITEMS[sid].color}">${itemIcon(sid)}</span> ${esc(ITEMS[sid].name)} <span class="gold">${buyPrice(ITEMS[sid].value)}g</span> <button data-buy="${sid}">Buy</button><button data-buy5="${sid}">x5</button></div>`).join('');
    const gear = shopGear(id).map((it, i) => `<div class="shoprow" data-tt="1" data-gi="${i}"><span class="ic" style="color:${itemColor(it)}">${equipIcon(it.base)}</span> <span style="color:${itemColor(it)}">${esc(it.name)}</span> <span class="gold">${buyPrice(it.price)}g</span> <button data-bg="${i}">Buy</button></div>`).join('');
    const bb = (G.buyback || []).map((b, i) => `<div class="shoprow small" data-tt="1" data-bb="${i}">${esc(itemName(b.it))}${b.it.qty > 1 ? ' x' + b.it.qty : ''} <button data-bbb="${i}">Buy back ${b.price}g</button></div>`).join('');
    const grid = P.inv.map((it, i) => this.slotHtml(it, i, 'sell')).join('');

    const root = $('#panel'); const gl = shopGear(id);
    root.querySelectorAll('[data-sid]').forEach(el => el._tt = () => itemTooltip({ id: el.dataset.sid, qty: 1 }));
    root.querySelectorAll('[data-gi]').forEach(el => el._tt = () => itemTooltip(gl[+el.dataset.gi], P.equip[gl[+el.dataset.gi].slot]));
    root.querySelectorAll('[data-bb]').forEach(el => el._tt = () => itemTooltip(G.buyback[+el.dataset.bb].it));
    const buy = (sid, n) => { const pr = buyPrice(ITEMS[sid].value) * n; if (P.gold < pr) return log('Not enough gold.', 'warn'); if (invAdd(P.inv, sid, n)) { log('Not enough space.', 'warn'); } P.gold -= pr; if (hasJob('merchant')) gainJobXp(P, 'merchant', pr * 0.15); sfx('coin'); this.shop(id); };
    root.querySelectorAll('[data-buy]').forEach(el => el.onclick = () => buy(el.dataset.buy, 1));
    root.querySelectorAll('[data-buy5]').forEach(el => el.onclick = () => buy(el.dataset.buy5, 5));
    root.querySelectorAll('[data-bg]').forEach(el => el.onclick = () => { const it = gl[+el.dataset.bg]; const pr = buyPrice(it.price); if (P.gold < pr) return log('Not enough gold.', 'warn'); if (!invAddEquip(P.inv, it)) return log('Inventory full.', 'warn'); P.gold -= pr; gl.splice(+el.dataset.bg, 1); sfx('coin'); this.shop(id); });
    root.querySelectorAll('[data-bbb]').forEach(el => el.onclick = () => { const b = G.buyback[+el.dataset.bbb]; if (P.gold < b.price) return log('Not enough gold.', 'warn'); const ok = b.it.kind === 'equip' ? invAddEquip(P.inv, b.it) : !invAdd(P.inv, b.it.id, b.it.qty); if (!ok) return log('Inventory full.', 'warn'); P.gold -= b.price; G.buyback.splice(+el.dataset.bbb, 1); this.shop(id); });
    this.bindGrid(root, 'sell', P.inv, (i, it) => { if (!it) return; const doSell = () => { sellItem(i); UI.shop(id); }; if (it.kind === 'equip' && (it.rarity >= 3 || it.quality >= 3)) return UI.choose('Sell ' + it.name + '?', `This is a valuable item. Sell it for <b class="gold">${sellPrice(it)}g</b>?`, [{ label: 'Sell it', danger: true, fn: doSell }], () => UI.shop(id)); doSell(); });
  },
  bank() {
    const P = G.player;
    const inv = P.inv.map((it, i) => this.slotHtml(it, i, 'binv')).join(''), bk = P.bank.items.map((it, i) => this.slotHtml(it, i, 'bank')).join('');
    this.show('bank', 'Vault & Bank', `<div>Carried gold: <b class="gold">${fmt(P.gold)}</b> · Banked gold: <b class="gold">${fmt(P.bank.gold)}</b> <span class="dim small">(banked gold is safe when you die)</span></div>
      <div class="row"><button onclick="bankGold(1)">Deposit all</button><button onclick="bankGold(0.5)">Deposit half</button><button onclick="bankGold(-1)">Withdraw all</button><button onclick="bankGold(-100)">Withdraw 100</button></div>
      <div class="cols"><div><h3>Bag — click to store</h3><div class="grid">${inv}</div></div><div><h3>Vault — click to take</h3><div class="grid">${bk}</div></div></div>`, true);

    this.bindGrid(root, 'bank', P.bank.items, (i, it) => { if (!it) return; if (it.kind === 'equip') { if (!invAddEquip(P.inv, it)) return; } else { const left = invAdd(P.inv, it.id, it.qty); if (left) { it.qty = left; this.bank(); return; } } P.bank.items[i] = null; this.bank(); });

  board() {

  craft(st) {
    const P = G.player; this._station = st; const job = STATIONS[st]; const rk = jobRank(P, job);

    const root = $('#panel');

  if (k === 'table') { ctx.fillStyle = '#6a4424'; ctx.fillRect(px, py + 6, 32, 20); ctx.fillStyle = '#8a5a30'; ctx.fillRect(px, py + 4, 32, 4); if (feastNight() && curMap().id === 'greathall') { ctx.fillStyle = '#d0a040'; ctx.beginPath(); ctx.arc(px + 10, py + 12, 4, 0, 7); ctx.fill(); ctx.fillStyle = '#b04a2a'; ctx.beginPath(); ctx.arc(px + 22, py + 14, 5, 0, 7); ctx.fill(); } }
  else if (k === 'hearth') { ctx.fillStyle = '#5a5650'; ctx.fillRect(px, py, 32, 30); ctx.fillStyle = `rgba(255,${130 + Math.sin(now * 7 + px) * 40 | 0},40,0.95)`; ctx.fillRect(px + 7, py + 10, 18, 14); }
  else if (k === 'candles') { ctx.fillStyle = '#c8b060'; ctx.fillRect(px + 14, py + 6, 4, 24); ctx.fillRect(px + 6, py + 8, 20, 3); ctx.fillStyle = '#ffe08a'; for (const cx of [7, 15, 23]) ctx.fillRect(px + cx, py + 1, 3, 6); }
  else if (k === 'throne') { ctx.fillStyle = '#d0a040'; ctx.fillRect(px + 4, py - 14, 24, 40); ctx.fillStyle = '#8a1a2a'; ctx.fillRect(px + 8, py - 8, 16, 28); ctx.fillStyle = '#ffd24a'; ctx.fillRect(px + 10, py - 20, 4, 6); ctx.fillRect(px + 18, py - 20, 4, 6); }
  else if (k === 'shelf') { ctx.fillStyle = '#5a3a20'; ctx.fillRect(px + 1, py - 10, 30, 40); for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) { ctx.fillStyle = ['#8a2a2a', '#2a4a8a', '#3a6a2a', '#8a6a2a', '#5a2a6a'][(r + c + o.x) % 5]; ctx.fillRect(px + 3 + c * 5.5, py - 8 + r * 10, 4, 8); } }
  else if (k === 'coffer') { ctx.fillStyle = '#6a3a1a'; ctx.fillRect(px + 3, py + 8, 26, 20); ctx.fillStyle = '#ffd24a'; ctx.fillRect(px + 3, py + 14, 26, 3); ctx.fillRect(px + 13, py + 12, 6, 8); }
  else if (k === 'bed') { ctx.fillStyle = '#6a4424'; ctx.fillRect(px + 2, py, 28, 30); ctx.fillStyle = '#8a1a2a'; ctx.fillRect(px + 4, py + 8, 24, 20); ctx.fillStyle = '#f0e8d0'; ctx.fillRect(px + 6, py + 2, 20, 6); }
  else if (k === 'bars') { ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.beginPath(); for (let k2 = 4; k2 < 32; k2 += 8) { ctx.moveTo(px + k2, py - 10); ctx.lineTo(px + k2, py + 30); } ctx.stroke(); ctx.lineWidth = 1; }
  else if (k === 'prisoner') { drawPerson(px + 16, py + 18, Object.assign(raceLook('human'), { tunic: '#6a6458', hair: '#3a2a1a' }), now); }
  else if (k === 'lectern') { ctx.fillStyle = '#5a3a20'; ctx.fillRect(px + 12, py + 10, 8, 20); ctx.fillStyle = '#8a5a30'; ctx.fillRect(px + 4, py + 4, 24, 8); const R = royal(); ctx.fillStyle = R.lecternDay === gameDay() ? '#aaa' : `rgba(180,140,255,${0.6 + Math.sin(now * 3) * 0.3})`; ctx.fillRect(px + 8, py + 1, 16, 5); }
  else if (k === 'circle') { ctx.strokeStyle = `rgba(170,120,255,${0.5 + Math.sin(now * 2) * 0.25})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px + 16, py + 16, 14, 0, 7); ctx.stroke(); ctx.lineWidth = 1; }
  else if (k === 'crate') { ctx.fillStyle = '#7a5a30'; ctx.beginPath(); ctx.ellipse(px + 16, py + 16, 11, 13, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#4a3a20'; ctx.fillRect(px + 5, py + 10, 22, 2); ctx.fillRect(px + 5, py + 20, 22, 2); }
  else if (k === 'desk') { ctx.fillStyle = '#6a4424'; ctx.fillRect(px + 1, py + 8, 30, 16); ctx.fillStyle = '#ffd24a'; ctx.fillRect(px + 8, py + 4, 6, 4); ctx.fillRect(px + 18, py + 5, 6, 3); }
  else if (k === 'stairs') { ctx.fillStyle = '#5a5650'; for (let k2 = 0; k2 < 4; k2++) ctx.fillRect(px + 2 + k2 * 2, py + 4 + k2 * 6, 28 - k2 * 4, 5); }
}
function drawCourtier(n, L, now) {
  const tunic = n.guard ? '#8a1a2a' : n.color, hat = n.guard ? '#7a7a88' : null;
  drawPerson(n.x, n.y, Object.assign(L, { tunic, hair: n.hair, moving: n.moving, facing: n.facing, atk: n.atkAnim || 0, weapon: n.guard || n.state === 'fight', weaponColor: '#ccd', flash: n.hitFlash > 0, hat, cape: n.cape || (n.guard ? '#ffd24a' : null) }), now);
  if (n.crown) { const s = L.small ? 0.85 : 1; ctx.fillStyle = '#ffd24a'; const cy = n.y - 27 * s; ctx.beginPath(); ctx.moveTo(n.x - 7, cy + 5); ctx.lineTo(n.x - 7, cy - 2); ctx.lineTo(n.x - 3.5, cy + 2); ctx.lineTo(n.x, cy - 4); ctx.lineTo(n.x + 3.5, cy + 2); ctx.lineTo(n.x + 7, cy - 2); ctx.lineTo(n.x + 7, cy + 5); ctx.fill(); }
  const st = chainStep(), mk = st && st.giver === n.cid && (!royal().cqActive || st.done(royal())) ? '♛' : npcMarker(n);
  if (mk) { ctx.fillStyle = mk === '?' ? '#7fff7f' : '#ffd24a'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; const yy = n.y - 38 - Math.abs(Math.sin(now * 3)) * 4; ctx.strokeText(mk, n.x, yy); ctx.fillText(mk, n.x, yy); ctx.lineWidth = 1; }
  if (n.hp < n.maxHp) { ctx.fillStyle = '#300'; ctx.fillRect(n.x - 14, n.y - 34, 28, 3); ctx.fillStyle = '#4c4'; ctx.fillRect(n.x - 14, n.y - 34, 28 * n.hp / n.maxHp, 3); }
}
